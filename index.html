<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>模拟王朝 · 御前龙案</title>
    <style>
        :root{--bg:#0a0705;--bg2:#1a120c;--bg3:#261b10;--bg4:#3a2a18;--gold:#d4a843;--gold-light:#f0d48a;--gold-dark:#9a7b2f;--red:#b03030;--red-light:#e06050;--green:#4a8a5a;--text:#f0e8d8;--text2:#c0b098;--text3:#908068;--border:#5a4430;--border-light:#8a6a40;--radius:10px;--radius-sm:5px;--shadow:0 6px 25px rgba(0,0,0,.7);--font-title:'Georgia','SimSun','KaiTi',serif;--gold-gradient:linear-gradient(135deg,#f5d77b,#c9a84c,#8a6a20)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:var(--font-title);min-height:100vh;background-image:radial-gradient(ellipse at 50% -20%,rgba(120,80,30,.25),transparent 60%)}
        .hidden{display:none!important}
        button{font-family:inherit;cursor:pointer;border:1px solid var(--border);background:linear-gradient(180deg,#2a1d10,#1a120c);color:var(--text);padding:6px 10px;border-radius:var(--radius-sm);font-size:.75em;white-space:nowrap;transition:all .25s ease}
        button:hover{border-color:var(--gold);color:var(--gold-light)}
        button:disabled{opacity:.4;cursor:not-allowed}
        .gold-btn{border-color:var(--gold);background:rgba(200,170,80,.25);color:var(--gold-light)}
        .danger{border-color:var(--red);color:var(--red-light)}
        .panel{background:linear-gradient(180deg,#1e150e,#160f09);border:1px solid var(--border);border-radius:var(--radius);padding:10px;overflow-y:auto;box-shadow:var(--shadow)}
        .panel-title{font-size:.82em;color:var(--gold);letter-spacing:3px;border-bottom:2px solid var(--border);padding-bottom:5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
        .panel-title::before,.panel-title::after{content:'◆';font-size:.55em;color:var(--gold)}
        .panel-title::after{margin-left:auto}
        #startScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .start-box{background:linear-gradient(180deg,#1e150e,#160f09);border:2px solid var(--gold-dark);border-radius:16px;padding:25px;max-width:680px;width:100%;box-shadow:var(--shadow);position:relative;overflow:hidden}
        .start-box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold-gradient)}
        .start-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--gold-gradient)}
        .start-box h1{text-align:center;color:var(--gold-light);font-size:2em;letter-spacing:10px;margin-bottom:4px;text-shadow:0 0 30px rgba(200,170,80,.6)}
        .subtitle{text-align:center;color:var(--text2);font-size:.85em;margin-bottom:18px;letter-spacing:5px;border-bottom:1px solid rgba(200,170,80,.2);padding-bottom:12px}
        .novice-select{display:flex;gap:12px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
        .novice-select button{padding:12px 22px;font-size:1em;border-radius:8px;min-width:130px;border:2px solid var(--border);background:linear-gradient(180deg,#2a1d10,#1a120c);color:var(--text2);letter-spacing:2px;transition:all .3s ease}
        .novice-select button.selected{border-color:var(--gold);background:rgba(200,170,80,.25);color:var(--gold-light);box-shadow:0 0 25px rgba(200,170,80,.4)}
        .novice-hint{text-align:center;font-size:.75em;color:var(--text3);margin-bottom:10px;min-height:18px}
        .form-divider{text-align:center;font-size:.7em;color:var(--text3);margin:10px 0;position:relative}
        .form-divider::before,.form-divider::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:rgba(200,170,80,.2)}
        .form-divider::before{left:5%}
        .form-divider::after{right:5%}
        .start-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
        .form-group{display:flex;flex-direction:column;gap:2px}
        .form-group label{font-size:.72em;color:var(--text2)}
        .form-group input,.form-group select{padding:8px 10px;background:rgba(20,14,8,.9);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:.85em;font-family:inherit}
        .form-group input:focus,.form-group select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 8px rgba(200,170,80,.3)}
        .error-msg{color:var(--red-light);font-size:.75em;min-height:18px;margin-top:4px;text-align:center}
        .start-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
        .start-actions button{flex:1;padding:12px;font-size:.85em;letter-spacing:2px;border-radius:8px}
        .save-slots{display:flex;gap:6px;margin-top:8px}
        .save-slots button{flex:1;padding:6px;font-size:.7em;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2)}
        .save-slots button.active{border-color:var(--gold);color:var(--gold-light)}
        #gameScreen{display:flex;flex-direction:column;gap:6px;padding:8px;max-width:1400px;margin:0 auto;min-height:100vh}
        .game-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:10px 18px;background:linear-gradient(180deg,#1e150e,#160f09);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
        .emblem{width:45px;height:45px;border-radius:50%;background:radial-gradient(circle,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--gold-light);box-shadow:0 0 20px rgba(200,170,80,.5)}
        .game-header h2{color:var(--gold-light);font-size:1.2em;letter-spacing:3px}
        .header-info{font-size:.7em;color:var(--text2)}
        .dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:4px;padding:8px;background:linear-gradient(180deg,#1e150e,#160f09);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
        .dash-item{display:flex;flex-direction:column;align-items:center;padding:5px 3px;background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border);font-size:.68em}
        .dash-item span:last-child{color:var(--gold-light);font-weight:bold}
        .main-layout{display:flex;gap:6px;flex:1;min-height:400px}
        .left-tabs{width:115px;display:flex;flex-direction:column;gap:3px;flex-shrink:0}
        .tab-btn{padding:5px 3px;text-align:center;font-size:.62em;background:linear-gradient(180deg,#2a1d10,#1a120c);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;white-space:nowrap;letter-spacing:1px}
        .tab-btn.active{border-color:var(--gold);background:rgba(200,170,80,.25);color:var(--gold-light);box-shadow:0 0 12px rgba(200,170,80,.3)}
        .center-col{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
        .right-col{width:220px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
        .content-panel{flex:1;min-height:180px}
        .action-panel{min-height:45px;max-height:140px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:3px;padding:6px}
        .log-panel{max-height:130px;overflow-y:auto;font-size:.64em}
        .log-entry{padding:1px 0;border-bottom:1px solid rgba(90,68,48,.3)}
        .log-entry.important{color:var(--gold-light);font-weight:bold}
        .log-entry.danger{color:var(--red-light)}
        .log-entry.success{color:var(--green)}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:5000}
        .modal{background:linear-gradient(180deg,#1e150e,#160f09);border:2px solid var(--gold-dark);border-radius:14px;padding:18px;max-width:560px;width:92%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.8)}
        .modal h3{color:var(--gold-light);margin-bottom:8px;font-size:1.1em;text-align:center;letter-spacing:3px}
        .modal-body{font-size:.85em;line-height:1.7}
        .modal-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;justify-content:center}
        .toast-container{position:fixed;top:12px;right:12px;z-index:6000;display:flex;flex-direction:column;gap:3px;max-width:300px}
        .toast{padding:8px 12px;border-radius:var(--radius-sm);background:linear-gradient(180deg,#2a1d10,#1a120c);border:1px solid var(--gold-dark);color:var(--text);font-size:.72em;box-shadow:var(--shadow);cursor:pointer}
        .toast.success{border-color:var(--green)}
        .toast.danger{border-color:var(--red)}
        @media(max-width:600px){.start-form{grid-template-columns:1fr}.main-layout{flex-direction:column}.left-tabs{width:100%;flex-direction:row;flex-wrap:wrap}.left-tabs .tab-btn{flex:1;min-width:45px;font-size:.55em}.right-col{width:100%;flex-direction:row;flex-wrap:wrap}.dashboard{grid-template-columns:repeat(auto-fit,minmax(60px,1fr))}.novice-select button{min-width:110px;padding:10px 14px}}
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="start-box">
            <h1>模 拟 王 朝</h1>
            <div class="subtitle">— 开 创 你 的 千 秋 帝 业 —</div>
            <div class="novice-select">
                <button id="btnNovice" onclick="Game.selectNovice(true)">🌱 我是新手</button>
                <button id="btnVeteran" onclick="Game.selectNovice(false)">⚔️ 我是老手</button>
            </div>
            <div class="novice-hint" id="noviceHint">请选择游戏经验（必选）</div>
            <div class="form-divider">— 自 定 义 王 朝 信 息 —</div>
            <div class="start-form">
                <div class="form-group"><label>国号</label><input id="inpNation" value="魏国" maxlength="4"></div>
                <div class="form-group"><label>年号</label><input id="inpEra" value="泰安" maxlength="4"></div>
                <div class="form-group"><label>皇帝称号</label><input id="inpTitle" value="魏太祖" maxlength="6"></div>
                <div class="form-group"><label>皇帝姓名</label><input id="inpEmperor" value="魏安" maxlength="8"></div>
                <div class="form-group"><label>皇后姓名</label><input id="inpEmpress" value="沈青黛" maxlength="8"></div>
                <div class="form-group"><label>国都</label><input id="inpCapital" value="天城" maxlength="6"></div>
                <div class="form-group"><label>陪都</label><input id="inpCity" value="石城" maxlength="6"></div>
                <div class="form-group"><label>难度</label><select id="inpDifficulty" onchange="Game.onDifficultyChange()"><option value="standard">标准</option><option value="hardcore">硬核</option></select><div id="difficultyDesc" style="font-size:.65em;color:var(--text3);">标准：正常平衡；硬核：税收-20%，敌国好战+10%，初始资源-20%。</div></div>
            </div>
            <div class="error-msg" id="startError"></div>
            <div class="start-actions">
                <button class="gold-btn" id="btnStart1" onclick="Game.startNewGame(1)" disabled title="开始新游戏（存档1）">💾 存档1</button>
                <button class="gold-btn" id="btnStart2" onclick="Game.startNewGame(2)" disabled title="开始新游戏（存档2）">💾 存档2</button>
                <button onclick="Game.continueGame(1)" id="btnCont1" class="hidden" title="读取存档1">📜 读档1</button>
                <button onclick="Game.continueGame(2)" id="btnCont2" class="hidden" title="读取存档2">📜 读档2</button>
            </div>
            <div class="save-slots" id="saveSlots"></div>
        </div>
    </div>
    <div id="gameScreen" class="hidden">
        <div class="game-header">
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="emblem" id="emblemText">魏</div>
                <div><h2 id="headerTitle">魏·泰安</h2><div class="header-info" id="headerInfo"></div></div>
            </div>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
                <button class="gold-btn" onclick="Game.confirmAdvanceMonth()" title="推进到下个月，结算所有收入支出">📅 下个月</button>
                <button onclick="Game.saveToSlot(1)" title="保存到存档槽1">💾存1</button>
                <button onclick="Game.saveToSlot(2)" title="保存到存档槽2">💾存2</button>
                <button onclick="Game.exportSave()" title="导出存档JSON文件">📤导出</button>
                <button onclick="document.getElementById('importFile').click()" title="导入存档JSON文件">📥导入</button>
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="Game.importSave(event)">
                <button class="danger" onclick="Game.confirmReset()" title="重置当前游戏">🔄重置</button>
            </div>
        </div>
        <div class="dashboard" id="dashboard"></div>
        <div class="main-layout">
            <div class="left-tabs" id="leftTabs"></div>
            <div class="center-col">
                <div class="panel content-panel"><div class="panel-title"><span id="panelTitle">国情</span></div><div id="contentBody"></div></div>
                <div class="panel action-panel" id="actionPanel"></div>
                <div class="panel log-panel" id="logPanel"></div>
            </div>
            <div class="right-col">
                <div class="panel"><div class="panel-title">皇帝</div><div id="emperorBox"></div></div>
                <div class="panel"><div class="panel-title">派系</div><div id="factionBox"></div></div>
                <div class="panel"><div class="panel-title">对话</div><div id="dialogueBox" style="max-height:130px;overflow-y:auto;font-size:.62em;"></div></div>
            </div>
        </div>
    </div>
    <div id="modalContainer"></div>
    <div class="toast-container" id="toastContainer"></div>

        s = deepDefaults(s, defaultState);
        // 恢复基本字段
        for(var k in keep){ if(keep[k]!==undefined) s[k]=keep[k]; }
        // 人口强制修复
        if(!s.population || isNaN(Number(s.population))) s.population = 4000;

function selectNovice(novice){
    noviceSelected=novice;
    document.getElementById('btnNovice').classList.toggle('selected',novice);
    document.getElementById('btnVeteran').classList.toggle('selected',!novice);
    document.getElementById('noviceHint').textContent=novice?'新手模式':'老手模式';
    document.getElementById('btnStart1').disabled=false;
    document.getElementById('btnStart2').disabled=false;
}
function startNewGame(slot){
    if(noviceSelected===null){document.getElementById('noviceHint').textContent='请先选择游戏经验！';return;}
    var err=document.getElementById('startError');
    var nation=document.getElementById('inpNation').value.trim();
    var era=document.getElementById('inpEra').value.trim();
    var title=document.getElementById('inpTitle').value.trim();
    var emp=document.getElementById('inpEmperor').value.trim();
    var empress=document.getElementById('inpEmpress').value.trim();
    var capital=document.getElementById('inpCapital').value.trim();
    var city=document.getElementById('inpCity').value.trim();
    var diff=document.getElementById('inpDifficulty').value;
    if(!validateInput(nation,2,4)){err.textContent='国号需2-4字';return;}
    if(!validateInput(era,2,4)){err.textContent='年号需2-4字';return;}
    if(!validateInput(title,2,6)){err.textContent='称号需2-6字';return;}
    if(!validateInput(emp,2,8)){err.textContent='皇帝姓名需2-8字';return;}
    if(!validateInput(empress,2,8)){err.textContent='皇后姓名需2-8字';return;}
    if(!validateInput(capital,2,6)){err.textContent='国都需2-6字';return;}
    if(!validateInput(city,2,6)){err.textContent='陪都需2-6字';return;}
    err.textContent='';
    gameState=createInitialState({nationName:nation,eraName:era,emperorTitle:title,emperorName:emp,empressName:empress,capital:capital,startCity:city,difficulty:diff});
    // 硬核模式调整
    if(diff==='hardcore'){
        gameState.treasury=Math.floor(Number(gameState.treasury)*0.8);
        gameState.grain=Math.floor(Number(gameState.grain)*0.8);
        gameState.iron=Math.floor(Number(gameState.iron)*0.8);
        gameState.population=Math.max(1,Math.floor(Number(gameState.population)*0.9));
        gameState.diplomacy.forEach(function(d){d.aggression=clamp(Number(d.aggression)+10,0,100);});
    }
    currentSlot=slot;
    addLog('🏛️ '+title+' '+emp+' 登基，国号'+nation,'system');
    saveToSlot(slot);
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    refreshUI();
    showToast('🏛️ 王朝建立！','success');
    if(noviceSelected === true){ showTutorial(); }
}
function continueGame(slot){
    if(loadFromSlot(slot)){
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        refreshUI();
        showToast('📜 读档成功','success');
    }else{ showToast('❌ 存档为空','danger'); }
}
function showStartScreen(){
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('startScreen').classList.remove('hidden');
    updateSaveSlots();
    document.getElementById('btnCont1').classList.toggle('hidden',!hasSaveSlot(1));
    document.getElementById('btnCont2').classList.toggle('hidden',!hasSaveSlot(2));
    document.getElementById('btnStart1').disabled=(noviceSelected===null);
    document.getElementById('btnStart2').disabled=(noviceSelected===null);
}
function confirmReset(){showModal('🔄 重置','确定要重置吗？',[{label:'确认',danger:true,onclick:'Game._doReset()'},{label:'取消',onclick:'Game.closeModal()'}]);}
function _doReset(){closeModal();localStorage.removeItem(getSaveKey(currentSlot));gameState=null;showStartScreen();showToast('已重置','danger');}
function registerMonthlyAction(id){if(!gameState.monthlyActions[id]){gameState.monthlyActions[id]=true;gameState.totalActionsThisMonth++;return true;}return false;}
function isActionUsed(id){return !!gameState.monthlyActions[id];}
function resetMonthlyActions(){gameState.monthlyActions={};gameState.totalActionsThisMonth=0;gameState.techResearchThisMonth=0;gameState.harem.loveCount=0;}
function performAction(actionId,params){
    if(isProcessing||gameState.isProcessing)return;
    isProcessing=true;gameState.isProcessing=true;
    try{
        var r=executeAction(actionId,params||{});
        if(r&&r.message){addLog(r.message,r.type||'info');if(r.toast)showToast(r.toast,'success');}
        checkAchievements();checkNearMinisters();checkGameOver();saveToSlot(currentSlot);refreshUI();
    }catch(e){
        console.error('操作出错：', e);
        showToast('操作出错：'+e.message, 'danger');
        addLog('⚠️ 操作失败：'+e.message, 'danger');
    }
    finally{isProcessing=false;gameState.isProcessing=false;}
}
function executeAction(actionId,params){
    var s=gameState;
    // 确保关键数字有效
    s.treasury = Number(s.treasury)||0;
    s.grain = Number(s.grain)||0;
    s.iron = Number(s.iron)||0;
    s.population = Number(s.population)||4000;
    s.peopleSupport = Number(s.peopleSupport)||60;
    s.administrationEfficiency = Number(s.administrationEfficiency)||60;
    s.armyMorale = Number(s.armyMorale)||60;
    s.armyPower = Number(s.armyPower)||50;
    s.emperorHealth = Number(s.emperorHealth)||80;
    s.prestige = Number(s.prestige)||55;
    s.emperorHealthMax = Number(s.emperorHealthMax)||100;
    var spendSilver=function(a){a=Number(a)||0;if(s.treasury<a)return false;s.treasury-=a;return true;};
    var addSilver=function(a){s.treasury=Number(s.treasury)+Number(a||0);};
    var spendGrain=function(a){a=Number(a)||0;if(s.grain<a)return false;s.grain-=a;return true;};
    var spendIron=function(a){a=Number(a)||0;if(s.iron<a)return false;s.iron-=a;return true;};
    var addIron=function(a){s.iron=clamp(Number(s.iron)+Number(a||0),0,999999);};
    var chPrestige=function(d){s.prestige=clamp(Number(s.prestige)+d,0,100);};
    var chMorale=function(d){s.armyMorale=clamp(Number(s.armyMorale)+d,0,100);};
    var chFaction=function(f,d){s.factions[f]=clamp(Number(s.factions[f])+d,0,100);};
    var chSupport=function(d){s.peopleSupport=clamp(Number(s.peopleSupport)+d,0,100);};
    switch(actionId){
        case '上朝':
            if(s.inCourt)return{message:'已在朝会中',type:'info'};
            if(isActionUsed('上朝'))return{message:'本月已上朝',type:'info'};
            if(!registerMonthlyAction('上朝'))return{message:'本月已上朝',type:'info'};
            s.inCourt=true;s.courtSession.active=true;s.courtSession.courtEnergy=5;s.courtSession.issuesHandled=0;
            s.courtSession.issues=generateCourtIssues();
            chPrestige(1);
            return{message:'📯 朝会开始！'+s.courtSession.issues.length+'个议题',type:'success'};
        case '处理议题':
            var ii=params.issueIndex,oi=params.optionIndex;
            if(!s.inCourt||!s.courtSession.active)return{message:'不在朝会中',type:'danger'};
            if(s.courtSession.courtEnergy<=0)return{message:'精力耗尽',type:'danger'};
            var issue=s.courtSession.issues[ii];
            if(!issue||issue.handled)return{message:'已处理',type:'danger'};
            var opt=issue.options[oi];
            if(!opt)return{message:'选项错误',type:'danger'};
            issue.handled=true;s.courtSession.courtEnergy-=1;s.courtSession.issuesHandled+=1;
            if(opt.effects){
                for(var ei=0;ei<opt.effects.length;ei++){
                    var e=opt.effects[ei];
                    if(e.type==='treasury')addSilver(e.value);
                    else if(e.type==='prestige')chPrestige(e.value);
                    else if(e.type==='faction')chFaction(e.faction,e.value);
                    else if(e.type==='morale')chMorale(e.value);
                    else if(e.type==='grain')s.grain=clamp(Number(s.grain)+e.value,0,999999999);
                    else if(e.type==='iron')addIron(e.value);
                    else if(e.type==='support')chSupport(e.value);
                    else if(e.type==='army'){if(s.army[e.unit]!==undefined)s.army[e.unit]=Math.max(0,Number(s.army[e.unit])+e.value);}
                    else if(e.type==='haremFavor'){s.harem.members.forEach(function(m){m.favor=clamp(Number(m.favor)+e.value,0,100);});}
                    else if(e.type==='armyPower'){s.armyPower=clamp(Number(s.armyPower)+e.value,0,100);}
                    else if(e.type==='population'){s.population=clamp(Number(s.population)+e.value,1,999999);}
                    else if(e.type==='chain'){s.courtSession.chainEvent=e.value;}
                }
            }
            // 正向评价
            if(opt.effects){
                var hasPositive=opt.effects.some(function(e){return (e.type==='prestige'&&e.value>0)||(e.type==='support'&&e.value>0);});
                if(hasPositive){
                    var praise=rand(['万民称颂','百官叹服','朝野欢腾','天下归心']);
                    addLog('👏 '+praise+'！','success');
                    if(Math.random()<0.3){s.treasury+=100000;addLog('📜 群臣上表称贺，奖励国库+10万两','success');}
                }
            }
            var follow='';
            if(s.courtSession.courtEnergy<=0){follow=' 精力耗尽，自动退朝';endCourtSession();}
            var record={date:getDate(),issue:issue.title,choice:opt.label};
            s.courtRecords.unshift(record);if(s.courtRecords.length>10)s.courtRecords.pop();
            addLog('📋 处理议题：'+issue.title,'important');
            return{message:'📋 '+opt.label+follow,type:'success'};
        case '跳议题':
            if(!s.inCourt)return{message:'不在朝会中',type:'danger'};
            var si=params.issueIndex;
            var issue2=s.courtSession.issues[si];
            if(!issue2||issue2.handled)return{message:'已处理',type:'danger'};
            if(issue2.required)return{message:'此议题必须处理！',type:'danger'};
            issue2.handled=true;chPrestige(-1);
            return{message:'⏭️ 跳过议题，声望-1',type:'info'};
        case '退朝':
            if(!s.inCourt)return{message:'不在朝会中',type:'danger'};
            var unhandled=s.courtSession.issues.filter(function(i){return i.required&&!i.handled;});
            if(unhandled.length>0)return{message:'仍有必须处理的议题！',type:'danger'};
            // 全部处理完毕
            var allHandled=s.courtSession.issues.every(function(i){return i.handled;});
            if(allHandled){
                s.consecutiveDiligentMonths=(Number(s.consecutiveDiligentMonths)||0)+1;
            } else {
                s.consecutiveDiligentMonths=0;
            }
            endCourtSession();
            return{message:'📯 退朝。众大臣：吾皇万岁万岁万万岁！',type:'success'};
        case '密奏调查':
            if(s.secretReports.length>=3)return{message:'已有3起密奏调查',type:'danger'};
            var offName=params.targetName||'';
            if(!offName)return{message:'请选择调查对象',type:'danger'};
            if(!spendSilver(300000))return{message:'❌ 国库不足30万两',type:'danger'};
            s.secretReports.push({id:getId(),target:offName,remainingMonths:2,totalMonths:2,found:null});
            return{message:'🕵️ 锦衣卫密奏调查启动（-30万两，2个月）',type:'success'};
        case '处理密奏':
            var srId=params.reportId;var decision=params.decision;
            var sr=s.secretReports.find(function(x){return x.id===srId;});
            if(!sr||sr.remainingMonths>0)return{message:'调查未完成',type:'danger'};
            if(sr.found===null)return{message:'未获得罪证',type:'danger'};
            var targetOff=null;
            var allOffs=[s.officials.内阁首辅];
            Object.keys(s.officials.六部尚书).forEach(function(k){allOffs.push(s.officials.六部尚书[k]);});
            targetOff=allOffs.find(function(o){return o&&o.name===sr.target;});
            if(!targetOff){targetOff={name:sr.target,loyalty:70,favor:50,ability:60,faction:'文官',morality:60,force:40,literature:60,wisdom:60};}
            var msg='';
            if(decision==='压下'){
                if(!spendSilver(100000))return{message:'❌ 国库不足10万两',type:'danger'};

                targetOff.loyalty=clamp(Number(targetOff.loyalty)+10,0,100);

            }else if(decision==='警告'){

                chPrestige(2);chFaction('文官',-3);

                addSilver(5000000);chSupport(-2);chFaction(targetOff.faction||'文官',-5);

        case '廷议':
            var issueName=params.issueName||'';

        case '考核官员':

            return{message:'🧘 修炼获得'+gain+'修为，当前修为'+s.cultivation.cultivationExp+'/'+s.cultivation.cultivationMaxExp,type:'success'};

            if(!s.cultivation.unlocked)return{message:'修仙未解锁',type:'info'};
            if(!registerMonthlyAction('炼丹'))return{message:'本月已炼丹',type:'info'};
            if(!spendSilver(1000000))return{message:'❌ 国库不足100万两',type:'danger'};
            if(Math.random()<0.2){return{message:'💥 炼丹失败！材料尽毁',type:'danger'};}
            var quality=rand(['下品','中品','上品','极品']);
            s.cultivation.pills.push({name:'灵丹',quality:quality});
            if(quality==='上品'||quality==='极品'){
                s.emperorHealth=clamp(Number(s.emperorHealth)+5,0,Number(s.emperorHealthMax)||100);
                addLog('💊 丹成九转，健康+5','success');
            }
            return{message:'💊 炼丹：获得'+quality+'灵丹',type:'success'};
        case '服用丹药':
            var pillIdx=params.pillIndex;
            if(!s.cultivation.pills||!s.cultivation.pills[pillIdx])return{message:'丹药不存在',type:'danger'};
            var pill=s.cultivation.pills[pillIdx];
            var pillGain={下品:20,中品:40,上品:80,极品:150}[pill.quality]||20;
            s.cultivation.cultivationExp=(Number(s.cultivation.cultivationExp)||0)+pillGain;
            if(pill.quality==='上品'||pill.quality==='极品'){
                s.emperorHealth=clamp(Number(s.emperorHealth)+5,0,Number(s.emperorHealthMax)||100);
                addLog('💊 丹成九转，健康+5','success');
            }
            s.cultivation.pills.splice(pillIdx,1);
            return{message:'💊 服用'+pill.quality+'灵丹，修为+'+pillGain,type:'success'};
        case '学习功法':
            var methodName=params.methodName;
            var mth=CULTIVATION_METHODS.find(function(x){return x.name===methodName;});
            if(!mth)return{message:'功法不存在',type:'danger'};
            if(!spendSilver(3000000))return{message:'❌ 国库不足300万两',type:'danger'};
            if(s.cultivation.learnedMethods.indexOf(methodName)>=0){
                s.cultivation.method=methodName;
                return{message:'📜 切换功法为'+methodName,type:'success'};
            }
            s.cultivation.learnedMethods.push(methodName);
            s.cultivation.method=methodName;
            return{message:'📜 学习功法'+methodName+'（-300万两）',type:'success'};
        case '驯养灵兽':
            if(!s.cultivation.unlocked)return{message:'修仙未解锁',type:'info'};
            if(!registerMonthlyAction('驯养灵兽'))return{message:'本月已驯养',type:'info'};
            if(!spendSilver(2000000))return{message:'❌ 国库不足200万两',type:'danger'};
            var bn=rand(['青鳞兽','白羽鹤','海东青','巨龟','鲛人','灵虎']);
            var bonus={青鳞兽:'侦察+1',白羽鹤:'传讯+1',海东青:'侦察+2',巨龟:'运输+2',鲛人:'水战+2',灵虎:'士气+5'}[bn]||'辅助';
            s.spiritBeasts.push({id:getId(),name:bn,type:bn,level:1,desc:getBeastDesc(bn),bonus:bonus});
            if(bn==='灵虎')chMorale(5);
            return{message:'🐉 驯养灵兽：获得'+bn+'，'+bonus,type:'success'};
        case '巡视州府':
            if(!registerMonthlyAction('巡视州府'))return{message:'本月已巡视',type:'info'};
            if(!spendSilver(100000))return{message:'❌ 国库不足10万两',type:'danger'};
            var prov=s.provinces.find(function(p){return p.id===params.provinceId;});
            if(!prov)return{message:'州府不存在',type:'danger'};
            prov.citizenry=clamp(Number(prov.citizenry)+3,0,100);
            chSupport(2);
            return{message:'🏙️ 巡视：民心+2',type:'success'};
        case '州府加税':
            if(!registerMonthlyAction('州府加税'))return{message:'本月已调税',type:'info'};
            var provTax=s.provinces.find(function(p){return p.id===params.provinceId;});
            if(!provTax)return{message:'州府不存在',type:'danger'};
            provTax.citizenry=clamp(Number(provTax.citizenry)-5,0,100);
            addSilver(Number(provTax.tax));
            return{message:'📈 加税：+'+fmt(provTax.tax)+'两，民心-5',type:'danger'};
        case '州府减税':
            if(!registerMonthlyAction('州府减税'))return{message:'本月已调税',type:'info'};
            var provCut=s.provinces.find(function(p){return p.id===params.provinceId;});
            if(!provCut)return{message:'州府不存在',type:'danger'};
            provCut.citizenry=clamp(Number(provCut.citizenry)+5,0,100);
            return{message:'📉 减税：民心+5',type:'success'};
        case '建造':
            var defs=getBuildDefinitions();
            var bd=defs[params.buildType];
            if(!bd)return{message:'未知建筑',type:'danger'};
            if(!spendSilver(bd.cost))return{message:'❌ 国库不足'+fmt(bd.cost)+'两',type:'danger'};
            s.ongoingActions.push({id:getId(),type:'建造',name:'建造'+bd.name,remainingMonths:bd.months,totalMonths:bd.months,data:params.buildType});
            return{message:'🔨 建造'+bd.name+'（-'+fmt(bd.cost)+'两）',type:'success'};
        case '遣使':
            var d5=s.diplomacy.find(function(x){return x.name===params.target;});
            if(!d5)return{message:'邻国不存在',type:'danger'};
            if(d5.atWar)return{message:'交战中',type:'danger'};
            if(!spendSilver(500000))return{message:'❌ 国库不足50万两',type:'danger'};
            d5.relation=clamp(Number(d5.relation)+5,0,100);
            if(!d5.tradeAgreement&&d5.relation>=60){
                d5.tradeAgreement=true;
                s.tradeAgreements.push(d5.name);
                addSilver(100000);
                addLog('🤝 与'+d5.name+'达成贸易往来！经济增长+5%，商路开通额外+10万两','success');
            }
            return{message:'📨 遣使：关系+5'+(d5.tradeAgreement?'，贸易往来达成':''),type:'success'};
        case '培养子嗣':
            var heir=s.heirs.find(function(h){return h.id===params.heirId;});
            if(!heir)return{message:'子嗣不存在',type:'danger'};
            if(!spendSilver(50000))return{message:'❌ 国库不足5万两',type:'danger'};
            heir.abilities.武力=clamp(Number(heir.abilities.武力)+2,0,100);
            heir.abilities.智力=clamp(Number(heir.abilities.智力)+2,0,100);
            if(Math.random()<0.3){
                s.emperorHealth=clamp(Number(s.emperorHealth)+1,0,Number(s.emperorHealthMax)||100);
                addLog('👶 孺子可教，皇帝心情愉悦，健康+1','success');
            }
            return{message:'👶 培养：武+2，智+2',type:'success'};
        default:
            return{message:'未知操作',type:'info'};
    }
}

function checkGameOver(){
    var s=gameState;
    if(s.gameOver)return;
    var failed=false,reason='';
    if(Number(s.emperorHealth)<=0){
        var heir=s.heirs.find(function(h){return h.gender==='皇子';});
        if(heir){
            s.emperorHealth=70;s.emperorAge=20;s.emperorName=heir.name;
            s.heirs=s.heirs.filter(function(h){return h.id!==heir.id;});
            addLog('👑 先帝驾崩，太子'+heir.name+'继位！','important');
            showModal('👑 新帝登基','太子'+heir.name+'继位！',[{label:'继续',onclick:'Game.closeModal()'}]);
        }else{failed=true;reason='皇帝驾崩且无继承人！';}
    }
    if(Number(s.treasury)<-10000000){failed=true;reason='国库亏损超1000万两！';}
    if(Number(s.prestige)<=0){failed=true;reason='声望归零！';}
    if(Number(s.population)<=0){failed=true;reason='人口凋零！';}
    if(failed){s.gameOver=true;showModal('💀 游戏结束',reason,[{label:'返回主菜单',onclick:'Game._gameOverToMenu()'}]);}
}

function computeAdministrationEfficiency(s){
    var eff=50;
    var officials=[s.officials.内阁首辅];
    Object.keys(s.officials.六部尚书).forEach(function(k){officials.push(s.officials.六部尚书[k]);});
    var avg=0,count=0;
    officials.forEach(function(o){if(o){avg+=(Number(o.ability)||0);count++;}});
    if(count>0){avg=avg/count; eff+=Math.floor((avg-60)/2);}
    if(Number(s.emperorHealth)>=70)eff+=5;
    else if(Number(s.emperorHealth)<50)eff-=5;
    if(Number(s.peopleSupport)>=60)eff+=5;
    else if(Number(s.peopleSupport)<40)eff-=5;
    if(s.localSystem){var ls=LOCAL_SYSTEMS.find(function(x){return x.name===s.localSystem;});if(ls&&ls.desc.indexOf('效率')>=0)eff+=10;}
    eff+=Math.floor((s.infrastructure.驿站||0)*1);
    eff+=Math.floor((s.infrastructure.官道||0)*1);
    eff+=Math.floor((Number(s.technology.文化)||0)*2);
    eff+=Math.floor((Number(s.technology.工业)||0)*1);
    if(s.cultivation&&s.cultivation.realmIndex>0)eff+=Math.floor(s.cultivation.realmIndex*0.5);
    if(s.efficiencyBonusTurns>0)eff+=2;
    return clamp(eff,0,100);
}
function applyBuildEffects(s){
    var infra=s.infrastructure;
    var bonus={treasury:0,grain:0,support:0,prestige:0};
    bonus.grain+=Math.floor((infra.农田||0)*5000*0.05);
    bonus.grain+=Math.floor((infra.灌溉渠||0)*3000*0.08);
    bonus.treasury+=Math.floor((infra.市集||0)*5000);
    bonus.treasury+=Math.floor((infra.铸钱局||0)*3000);
    bonus.treasury+=Math.floor((infra.盐场||0)*4000);
    bonus.treasury+=Math.floor((infra.织造局||0)*2000);
    bonus.prestige+=Math.floor((infra.社稷坛||0)*3);
    bonus.support+=Math.floor((infra.惠民药局||0)*2);
    bonus.support+=Math.floor((infra.义仓||0)*2);
    bonus.support+=Math.floor((infra.养济院||0)*2);
    bonus.support+=Math.floor((infra.御花园||0)*1);
    if(infra.孔庙)s.factions.文官=clamp(Number(s.factions.文官)+(infra.孔庙||0)*3,0,100);
    if(infra.武庙)s.factions.武将=clamp(Number(s.factions.武将)+(infra.武庙||0)*3,0,100);
    if(infra.太庙)s.factions.宗室=clamp(Number(s.factions.宗室)+(infra.太庙||0)*3,0,100);
    if(infra.铁矿)s.iron=clamp(Number(s.iron)+Math.floor((infra.铁矿||0)*500),0,999999);
    if(infra.军器监)s.armyPower=clamp(Number(s.armyPower)+Math.floor((infra.军器监||0)*2),0,100);
    return bonus;
}
function applyArmyEquipmentEffects(s){
    var totalEq=0;

}
function advanceMonth(){
    if(isProcessing||gameState.isProcessing)return;
    isProcessing=true;gameState.isProcessing=true;
    try{
        var s=gameState;
        // 强制数字有效性，修复 NaN 和人口为0
        s.treasury = Number(s.treasury) || 0;
        s.grain = Number(s.grain) || 0;
        s.iron = Number(s.iron) || 0;
        s.population = Number(s.population) || 0;
        if(s.population <= 0) s.population = 4000; // 人口兜底
        s.population = Math.max(1, s.population);
        s.peopleSupport = Number(s.peopleSupport) || 60;
        s.administrationEfficiency = Number(s.administrationEfficiency) || 60;
        s.armyMorale = Number(s.armyMorale) || 60;
        s.armyPower = Number(s.armyPower) || 50;
        s.emperorHealth = Number(s.emperorHealth) || 80;
        s.emperorHealthMax = Number(s.emperorHealthMax) || 100;
        s.prestige = Number(s.prestige) || 55;
        s.cloth = Number(s.cloth) || 0;
        s.medicine = Number(s.medicine) || 0;
        s.wood = Number(s.wood) || 0;
        s.stone = Number(s.stone) || 0;
        Object.keys(s.army).forEach(function(k){ s.army[k] = Number(s.army[k]) || 0; });

        // 月度推进
        s.month+=1;
        if(s.month>12){
            s.month=1;
            s.year+=1;
            s.emperorAge+=1;
        }
        resetMonthlyActions();

        // ========== 年度总结 ==========
        if(s.month===1 && s.year>1){
            var annualTitle='';
            if(Number(s.peopleSupport)>=80 && Number(s.treasury)>50000000){
                annualTitle='太平盛世';
                s.prestige=clamp(Number(s.prestige)+2,0,100);
                s.peopleSupport=clamp(Number(s.peopleSupport)+1,0,100);
                addLog('🏮 年度总结：国泰民安，授予年号「太平盛世」，声望+2，民心+1','important');
            } else if(Number(s.armyPower)>=80 && Number(s.prestige)>=70){
                annualTitle='文治武功';
                s.armyMorale=clamp(Number(s.armyMorale)+2,0,100);
                s.prestige=clamp(Number(s.prestige)+1,0,100);
                addLog('🏮 年度总结：武功赫赫，授予年号「文治武功」，士气+2，声望+1','important');
            } else if(s.cultivation.realmIndex>=3){
                annualTitle='仙缘深厚';
                s.cultivation.cultivationExp=(Number(s.cultivation.cultivationExp)||0)+50;
                s.emperorHealth=clamp(Number(s.emperorHealth)+2,0,s.emperorHealthMax);
                addLog('🏮 年度总结：仙缘深厚，授予年号「仙缘深厚」，修为+50，健康+2','important');
            } else {
                annualTitle='勤政之君';
                s.administrationEfficiency=clamp(Number(s.administrationEfficiency)+1,0,100);
                addLog('🏮 年度总结：勤政爱民，授予年号「勤政之君」，行政效率+1','important');
            }
            showToast('🏮 年号奖励：'+annualTitle,'success');
        }

        // ========== 连续勤政奖励 ==========
        if(Number(s.consecutiveDiligentMonths)===3){
            s.prestige=clamp(Number(s.prestige)+2,0,100);
            s.treasury+=300000;
            addLog('🏅 连续三月勤政，奖励：声望+2，国库+30万','success');
        } else if(Number(s.consecutiveDiligentMonths)===6){
            s.prestige=clamp(Number(s.prestige)+3,0,100);
            s.officials.内阁首辅.favor=clamp(Number(s.officials.内阁首辅.favor)+3,0,100);
            addLog('🏅 连续六月勤政，奖励：声望+3，首辅好感+3','success');
        } else if(Number(s.consecutiveDiligentMonths)>=12){
            s.administrationEfficiency=clamp(Number(s.administrationEfficiency)+2,0,100);
            s.treasury+=1000000;
            addLog('🏅 连续一年勤政，奖励：行政效率+2，国库+100万','success');
            s.consecutiveDiligentMonths=0;
        }

        // ========== 派系斗争随机触发 ==========
        if(Math.random()<0.35){
            var factions=[{name:'文官',val:Number(s.factions.文官)},{name:'武将',val:Number(s.factions.武将)},{name:'宗室',val:Number(s.factions.宗室)},{name:'外戚',val:Number(s.factions.外戚)},{name:'宦官',val:Number(s.factions.宦官)}];
            var high=factions[0],low=factions[0];
            factions.forEach(function(f){if(f.val>high.val)high=f;if(f.val<low.val)low=f;});
            var diff=high.val-low.val;
            if(diff>=20){
                var event={title:'派系斗争：'+high.name+'压过'+low.name,desc:high.name+'势力日益壮大，与'+low.name+'矛盾激化，朝堂之上互相攻讦。',options:[
                    {label:'支持'+high.name,effect:function(){chFaction(high.name,3);chFaction(low.name,-5);chPrestige(-1);addLog('📌 支持'+high.name+'，派系失衡加剧。','danger');}},
                    {label:'支持'+low.name,effect:function(){chFaction(low.name,3);chFaction(high.name,-5);chPrestige(1);addLog('📌 支持'+low.name+'，勉强维持平衡。','success');}},
                    {label:'和稀泥',effect:function(){chFaction(high.name,-2);chFaction(low.name,-2);chSupport(2);s.administrationEfficiency=clamp(Number(s.administrationEfficiency)+2,0,100);s.efficiencyBonusTurns=3;addLog('📌 各打五十大板，朝野安定，行政效率临时+2（持续3月）','success');}}

            }
        }

        // ========== 处理进行中的行动 ==========
        var completed=[];
        s.ongoingActions=s.ongoingActions.filter(function(a){
            a.remainingMonths-=1;
            if(a.remainingMonths<=0){completed.push(a);return false;}
            return true;
        });
        completed.forEach(function(a){
            if(a.type==='科举'){

            }else if(a.type==='出征'){
                s.activeExpeditions=Math.max(0,s.activeExpeditions-1);

                            addLog('🕊️ 以德服人，释放部分俘虏，战败国关系+10，声望+1','success');
                        }
                        addLog('⚔️ 战报：'+a.general+'出征'+a.target+'大捷！俘获人口'+fmt(capturedPop)+'万，俘虏士兵'+fmt(capturedSoldiers)+'，新得州府'+citiesToAdd+'座，国库+200万，民心+3，士气+3','success');
                    }else{
                        s.prestige=clamp(Number(s.prestige)-5,0,100);
                        s.armyMorale=clamp(Number(s.armyMorale)-3,0,100);
                        addLog('⚔️ 战报：出征'+a.target+'失利。','danger');
                        d.atWar=false;
                    }
                    s.atWarWith=s.atWarWith.filter(function(n){return n!==a.target;});
                }
            }else if(a.type==='侦查'){
                var d2=s.diplomacy.find(function(x){return x.name===a.target;});
                if(d2){
                    addLog('🕵️ 侦查'+a.target+'完成！兵力'+fmt(d2.army)+'，人口'+d2.population+'万，将领'+d2.generalName+'能力'+d2.generalAbility+'，城防'+d2.wallLevel+'，粮草'+d2.foodReserve,'important');
                }
            }else if(a.type==='建造'){
                var bd=getBuildDefinitions()[a.data];
                if(bd){
                    s.infrastructure[a.data]=(Number(s.infrastructure[a.data])||0)+1;
                    s.buildStreak=(Number(s.buildStreak)||0)+1;
                    if(s.buildStreak>=3){
                        s.buildStreak=0;
                        s.officials.内阁首辅.favor=clamp(Number(s.officials.内阁首辅.favor)+2,0,100);
                        s.peopleSupport=clamp(Number(s.peopleSupport)+1,0,100);
                        addLog('🏗️ 大工告成，官员好感+2，民心+1','success');
                    }
                    addLog('🔨 '+bd.name+'建造完成，效果生效','success');
                }
            }
        });

        // ========== 密奏调查进度 ==========
        s.secretReports.forEach(function(sr){
            if(sr.remainingMonths>0){
                sr.remainingMonths-=1;
                if(sr.remainingMonths===0){
                    var crimes=['贪腐','结党','谋反','受贿','欺君'];
                    sr.found=rand(crimes);
                    addLog('🕵️ 密奏调查完成：发现'+sr.target+'有'+sr.found+'之嫌！','danger');
                }
            }
        });

        // ========== 锦衣卫调查进度 ==========
        s.investigations.forEach(function(inv){
            if(inv.remainingMonths>0){
                inv.remainingMonths-=1;
                if(inv.remainingMonths===0){
                    if(inv.found){addLog('🕵️ 调查完成：发现证据！可抄家','success');}
                    else{addLog('🕵️ 调查完成：未发现异常','info');}
                }
            }
        });

        // ========== 军械装备效果 ==========
        applyArmyEquipmentEffects(s);
        var buildBonus=applyBuildEffects(s);
        s.administrationEfficiency=computeAdministrationEfficiency(s);
        if(s.efficiencyBonusTurns>0)s.efficiencyBonusTurns--;

        // ========== 税收计算（详细） ==========
        var effFactor=0.8+Number(s.administrationEfficiency)/100*0.4;
        var costFactor=1-Number(s.administrationEfficiency)/250;
        var tradeBonus=s.tradeAgreements.length*0.05;
        var tradePenalty=s.warPenaltyTurns>0?0.2:0;
        var commerceBonus=(Number(s.commerce.市舶司)||0)*0.01+(Number(s.commerce.商路)||0)*0.005+(Number(s.commerce.盐引)||0)*0.008+(Number(s.commerce.茶马互市)||0)*0.006;
        var achievementTaxBonus=Number(s.achievementBonus.taxRate)||0;
        var ecoFactor=1+tradeBonus+commerceBonus+achievementTaxBonus-tradePenalty;
        var baseTax=Math.max(0,Number(s.population)*50+(Number(s.technology.商业)||0)*3000+(Number(s.infrastructure.市集)||0)*5000+Number(buildBonus.treasury));
        var taxIncome=Math.floor(baseTax*effFactor*ecoFactor);
        var militaryCost=0;
        Object.keys(s.army).forEach(function(k){militaryCost+=Number(s.army[k]);});
        militaryCost*=1.5*costFactor;
        var policyNeg=0;
        if(s.nationalPolicy){policyNeg=Math.floor(baseTax*0.05);}
        var net=taxIncome-militaryCost-100000*costFactor-Number(s.harem.budget)-policyNeg;
        net=Number(net)||0;
        if(s.difficulty==='hardcore'){net=Math.floor(net*0.8);}
        s.treasury+=net;
        s.grain=clamp(Number(s.grain)+Math.floor(Number(s.population)*5+(Number(s.technology.农业)||0)*2000+Number(buildBonus.grain))-Math.floor(militaryCost/400),0,999999999);

        // 赋税明细日志
        var taxDetail = '📊 赋税明细：基础税收 '+fmt(baseTax)+'两，效率系数 '+effFactor.toFixed(2)+'，贸易/商业系数 '+ecoFactor.toFixed(2)+'，实际税收 '+fmt(taxIncome)+'两；军费 '+fmt(militaryCost)+'两，其他支出 '+(fmt(100000*costFactor+Number(s.harem.budget)+policyNeg))+'两，净收入 '+(net>=0?'+':'')+fmt(net)+'两。';
        addLog(taxDetail,'system');

        // ========== 仓储管理 ==========
        if(s.grain>500000){
            var rot=Math.floor((s.grain-500000)*0.05);
            s.grain-=rot;
            addLog('⚠️ 粮仓储粮过高，霉变损耗'+fmt(rot)+'石','danger');
        }
        if(s.grain<10000){
            s.peopleSupport=clamp(Number(s.peopleSupport)-2,0,100);
            addLog('⚠️ 粮储不足，百姓恐慌，民心-2','danger');
        }
        s.population+=Math.floor(Number(s.population)*0.001);
        if(s.warPenaltyTurns>0){s.warPenaltyTurns--;}

        // 国策负面
        if(s.nationalPolicy){
            s.nationalPolicy.remainingMonths-=1;
            if(s.nationalPolicy.remainingMonths<=0){
                addLog('📜 国策「'+s.nationalPolicy.name+'」到期','system');
                s.nationalPolicy=null;
            }else{
                var ne=s.nationalPolicy.neg;
                if(ne.indexOf('税收')>=0)s.treasury=clamp(Number(s.treasury)-Math.floor(baseTax*0.05),-999999999,999999999);
                if(ne.indexOf('民心')>=0)s.peopleSupport=clamp(Number(s.peopleSupport)-2,0,100);
                if(ne.indexOf('国库')>=0)s.treasury=clamp(Number(s.treasury)-Math.floor(baseTax*0.03),-999999999,999999999);
                if(ne.indexOf('武将')>=0)s.factions.武将=clamp(Number(s.factions.武将)-2,0,100);
                if(ne.indexOf('文官')>=0)s.factions.文官=clamp(Number(s.factions.文官)-2,0,100);
                if(ne.indexOf('宗室')>=0)s.factions.宗室=clamp(Number(s.factions.宗室)-2,0,100);
            }
        }

        // 地方制度负面
        var ls=LOCAL_SYSTEMS.find(function(x){return x.name===s.localSystem;});
        if(ls&&ls.neg){
            if(ls.neg.indexOf('税收')>=0)s.treasury=clamp(Number(s.treasury)-Math.floor(baseTax*0.03),-999999999,999999999);
            if(ls.neg.indexOf('民心')>=0)s.peopleSupport=clamp(Number(s.peopleSupport)-1,0,100);
            if(ls.neg.indexOf('财政')>=0)s.treasury=clamp(Number(s.treasury)-Math.floor(baseTax*0.03),-999999999,999999999);
            if(ls.neg.indexOf('边境')>=0)s.armyMorale=clamp(Number(s.armyMorale)-2,0,100);
            if(ls.neg.indexOf('治安')>=0)s.peopleSupport=clamp(Number(s.peopleSupport)-1,0,100);
            if(ls.neg.indexOf('中央')>=0)s.prestige=clamp(Number(s.prestige)-1,0,100);
            if(ls.neg.indexOf('效率')>=0)s.administrationEfficiency=clamp(Number(s.administrationEfficiency)-2,0,100);
            if(ls.neg.indexOf('俸禄')>=0)s.treasury=clamp(Number(s.treasury)-100000,-999999999,999999999);
        }

        // ========== 后宫怀孕生产 ==========
        s.harem.members.forEach(function(m){
            if(m.pregnant){
                m.pregnancyMonth+=1;
                if(m.pregnancyMonth>=9){
                    m.pregnant=false;m.pregnancyMonth=0;m.hasNanny=false;m.hasMidwife=false;
                    var gender=Math.random()>0.5?'皇子':'皇女';
                    var cn=rand(gender==='皇子'?['承乾','承业','承志','承安','承辉']:['嫣然','若曦','静姝','婉清','月华']);
                    var personality=rand(['勇武','聪慧','仁厚','阴狠','平庸']);
                    var child={id:getId(),name:cn,gender:gender,motherId:m.id,motherName:m.name,birthYear:s.year,birthMonth:s.month,age:0,abilities:{武力:gender==='皇子'?10:5,智力:gender==='皇子'?10:8,政治:gender==='皇子'?8:10,魅力:10},title:gender==='皇子'?'皇子':'皇女',personality:personality,talent:rand(['武学','文学','谋略','无']),teacher:'',education:{文:0,武:0,政:0,谋:0},isCrownPrince:false,title2:'无'};
                    m.children.push(child.id);s.heirs.push(child);
                    addLog('👶 '+m.name+'诞下'+gender+'【'+cn+'】（'+personality+'）！','success');
                    if(child.abilities.武力>=80||child.abilities.智力>=80||child.abilities.政治>=80){
                        s.emperorHealth=clamp(Number(s.emperorHealth)+3,0,s.emperorHealthMax);
                        s.prestige=clamp(Number(s.prestige)+1,0,100);
                        s.peopleSupport=clamp(Number(s.peopleSupport)+1,0,100);
                        addLog('👼 天降麟儿/凤女，健康+3，声望+1，民心+1','success');
                    }
                    if(m.rank==='皇后'||['贵妃','淑妃','德妃','贤妃'].indexOf(m.rank)>=0){
                        s.harem.members.forEach(function(x){x.favor=clamp(Number(x.favor)+1,0,100);});
                        addLog('🎉 '+(m.rank==='皇后'?'嫡子降生':'爱妃诞子')+'，后宫全体宠爱+1','success');
                    }
                }
            }
        });

        // ========== 子嗣成长 ==========
        s.heirs.forEach(function(h){
            if(s.month===1)h.age+=1;
            if(h.age<18&&Math.random()>0.7){
                h.abilities.武力=clamp(Number(h.abilities.武力)+(h.personality==='勇武'?3:1),0,100);
                h.abilities.智力=clamp(Number(h.abilities.智力)+(h.personality==='聪慧'?3:1),0,100);
                if(h.teacher){
                    h.education.文=clamp(Number(h.education.文)+1,0,100);
                    h.education.武=clamp(Number(h.education.武)+1,0,100);
                }
            }
            if(h.age===18 && (Number(h.abilities.武力)+Number(h.abilities.智力)+Number(h.abilities.政治)+Number(h.abilities.魅力))>=300){
                s.prestige=clamp(Number(s.prestige)+2,0,100);
                s.peopleSupport=clamp(Number(s.peopleSupport)+1,0,100);
                addLog('🌟 后继有人，声望+2，民心+1','success');
            }
        });

        // ========== 皇帝健康 ==========
        s.emperorHealth=clamp(Number(s.emperorHealth)-(Math.random()>0.85?1:0),0,s.emperorHealthMax);

        // ========== 后宫失宠事件 ==========
        var lowFavorMembers=s.harem.members.filter(function(m){return m.favor<20;});
        if(lowFavorMembers.length&&Math.random()>0.7){
            var lf=rand(lowFavorMembers);
            addLog('⚠️ 佳丽'+lf.name+'因长期失宠而郁郁寡欢，宠爱度过低！','danger');
            lf.favor=clamp(Number(lf.favor)+5,0,100);
            s.peopleSupport=clamp(Number(s.peopleSupport)-2,0,100);
        }

        // ========== 修仙奇遇 ==========
        if(s.cultivation.unlocked&&Math.random()<0.25){
            var events=[
                {msg:'🧘 闭关修炼，心有所悟',eff:function(){s.cultivation.cultivationExp=(Number(s.cultivation.cultivationExp)||0)+15;}},
                {msg:'🌩️ 天劫降临，险些丧命',eff:function(){s.emperorHealth=clamp(Number(s.emperorHealth)-10,0,s.emperorHealthMax);s.cultivation.cultivationExp=(Number(s.cultivation.cultivationExp)||0)+30;}},
                {msg:'👤 仙人指路，修为大进',eff:function(){s.cultivation.cultivationExp=(Number(s.cultivation.cultivationExp)||0)+40;s.prestige=clamp(Number(s.prestige)+2,0,100);}},
                {msg:'🏞️ 秘境探索，得灵药',eff:function(){s.cultivation.pills.push({name:'灵丹',quality:'上品'});}},
                {msg:'💭 心魔入体，心神不宁',eff:function(){s.emperorHealth=clamp(Number(s.emperorHealth)-5,0,s.emperorHealthMax);s.cultivation.cultivationExp=clamp(Number(s.cultivation.cultivationExp)-10,0,999999);}},
                {msg:'💧 灵泉沐浴，身心舒畅',eff:function(){s.emperorHealth=clamp(Number(s.emperorHealth)+8,0,s.emperorHealthMax);}},
                {msg:'🌧️ 天降甘霖，旱灾解除',eff:function(){s.provinceEvents=s.provinceEvents.filter(function(e){return e.type!=='旱灾';}); s.peopleSupport=clamp(Number(s.peopleSupport)+3,0,100);}}
            ];
            var evt=rand(events);evt.eff();addLog('🔮 修仙奇遇：'+evt.msg,'important');
        }

        // ========== 灵兽随机正面事件 ==========
        s.spiritBeasts.forEach(function(beast){
            if(Math.random()<0.2){
                var effect=rand(['health','treasury','support']);
                if(effect==='health'){s.emperorHealth=clamp(Number(s.emperorHealth)+1,0,s.emperorHealthMax);addLog('🐉 灵兽护主，健康+1','success');}
                else if(effect==='treasury'){s.treasury+=100000;addLog('🐉 灵兽献瑞，国库+10万','success');}
                else {s.peopleSupport=clamp(Number(s.peopleSupport)+1,0,100);addLog('🐉 灵兽呈祥，民心+1','success');}
            }
        });

        // ========== 随机特殊事件 ==========
        if(Math.random()>0.4){
            var evts=[
                {msg:'🌾 风调雨顺，丰收',eff:function(){s.grain+=20000;}},
                {msg:'🌊 南方水患',eff:function(){s.grain=Math.max(0,s.grain-10000);}},
                {msg:'🏥 瘟疫流行',eff:function(){s.population=Math.max(1,s.population-10);}},
                {msg:'🤒 皇帝偶感风寒',eff:function(){s.emperorHealth=clamp(Number(s.emperorHealth)-8,0,s.emperorHealthMax);}},
                {msg:'✨ 祥瑞现世',eff:function(){s.prestige=clamp(Number(s.prestige)+3,0,100);s.peopleSupport=clamp(Number(s.peopleSupport)+3,0,100);}},
                {msg:'📜 文人雅集',eff:function(){s.factions.文官=clamp(Number(s.factions.文官)+3,0,100);}},
                {msg:'⚔️ 武将比武',eff:function(){s.factions.武将=clamp(Number(s.factions.武将)+3,0,100);s.armyMorale=clamp(Number(s.armyMorale)+3,0,100);}},
                {msg:'💎 矿脉发现',eff:function(){s.iron=clamp(Number(s.iron)+3000,0,999999);}},
                {msg:'📈 商路畅通',eff:function(){s.treasury+=800000;}},
                {msg:'🧧 百姓献礼',eff:function(){s.treasury+=500000;s.peopleSupport=clamp(Number(s.peopleSupport)+2,0,100);}},
                {msg:'🛡️ 将士请战',eff:function(){s.armyMorale=clamp(Number(s.armyMorale)+5,0,100);}},
                {msg:'👑 万国来朝',eff:function(){s.prestige=clamp(Number(s.prestige)+5,0,100);s.treasury+=2000000;}}
            ];
            var evt2=rand(evts);evt2.eff();addLog('📢 '+evt2.msg,'important');
        }

        // ========== 州府事件 ==========
        if(Math.random()>0.6){
            var p=rand(s.provinces);
            var type=rand(['水灾','旱灾','民变']);
            var options=[];
            if(type==='水灾')options=[{label:'赈灾（-5万石粮）',effect:function(){if(s.grain>=50000){s.grain-=50000;p.citizenry=clamp(Number(p.citizenry)+5,0,100);}}},{label:'不管（民心-8）',effect:function(){p.citizenry=clamp(Number(p.citizenry)-8,0,100);}}];
            else if(type==='旱灾')options=[{label:'引水（-10万两）',effect:function(){if(s.treasury>=100000){s.treasury-=100000;p.citizenry=clamp(Number(p.citizenry)+3,0,100);}}},{label:'祈雨（民心-2）',effect:function(){p.citizenry=clamp(Number(p.citizenry)-2,0,100);}}];
            else options=[{label:'镇压（-5万两）',effect:function(){if(s.treasury>=50000){s.treasury-=50000;p.garrison=Math.max(0,Number(p.garrison)-5000);}}},{label:'安抚（-5万两，民心+5）',effect:function(){if(s.treasury>=50000){s.treasury-=50000;p.citizenry=clamp(Number(p.citizenry)+5,0,100);}}}];
            s.provinceEvents.push({id:getId(),provinceId:p.id,provinceName:p.name,type:type,options:options,handled:false,required:true});
        }

        // ========== 外交友邦进贡 ==========
        s.diplomacy.forEach(function(d){
            if(Number(d.relation)>=80 && Math.random()<0.2){
                var tribute=rand(['iron','cloth','medicine']);
                if(tribute==='iron')s.iron=clamp(Number(s.iron)+500,0,999999);
                else if(tribute==='cloth')s.cloth=clamp(Number(s.cloth)+1000,0,999999);
                else s.medicine=clamp(Number(s.medicine)+500,0,999999);
                addLog('🎁 友邦来朝，进贡'+tribute,'success');
            }
        });

        // ========== 修仙解锁 ==========
        if(s.year>=5&&!s.cultivation.unlocked){
            s.cultivation.unlocked=true;s.cultivation.realmIndex=1;s.cultivation.realm='炼气';
            addLog('🔮 修仙体系解锁！','system');
        }

        // ========== 月度亮点总结 ==========
        var monthlyHighlights=[];
        if(net>0)monthlyHighlights.push('本月国库盈余 '+fmt(net)+' 两');
        if(s.examCandidates.length>0)monthlyHighlights.push('本月科举得才 '+s.examCandidates.length+' 人');
        if(s.atWarWith.length===0)monthlyHighlights.push('边境安然无事');
        if(s.harem.members.some(function(m){return m.pregnant;}))monthlyHighlights.push('后宫有喜');
        if(Number(s.cultivation.cultivationExp)>0)monthlyHighlights.push('修仙精进');
        if(monthlyHighlights.length>0){
            addLog('✨ 本月亮点：'+monthlyHighlights.join('，'),'success');
            var bonusType=rand(['民心','声望','国库']);
            if(bonusType==='民心'){s.peopleSupport=clamp(Number(s.peopleSupport)+1,0,100);addLog('奖励：民心+1','success');}
            else if(bonusType==='声望'){s.prestige=clamp(Number(s.prestige)+1,0,100);addLog('奖励：声望+1','success');}
            else {s.treasury+=100000;addLog('奖励：国库+10万两','success');}
        }

        // ========== 民心阶段奖励 ==========
        if(s.peopleSupport>=80&&s.supportMilestones.indexOf(80)<0){s.supportMilestones.push(80);s.treasury+=500000;addLog('🏮 百姓安居，国库+50万','success');}
        if(s.peopleSupport>=90&&s.supportMilestones.indexOf(90)<0){s.supportMilestones.push(90);s.prestige=clamp(Number(s.prestige)+2,0,100);addLog('🏮 路不拾遗，声望+2','success');}
        if(s.peopleSupport>=100&&s.supportMilestones.indexOf(100)<0){s.supportMilestones.push(100);s.administrationEfficiency=clamp(Number(s.administrationEfficiency)+2,0,100);addLog('🏮 盛世之象，行政效率+2','success');}

        // ========== 小目标检查 ==========
        var nextGoal=getNextSmallGoal(s);
        if(nextGoal&&nextGoal.check()){
            completeSmallGoal(s,nextGoal);
        }

        // ========== 日志与保存 ==========
        addLog('📅 '+getDate()+' 税收'+fmt(taxIncome)+'，净收入'+(net>=0?'+':'')+fmt(net)+'，效率'+s.administrationEfficiency,'system');
        checkAchievements();checkNearMinisters();checkGameOver();
        saveToSlot(currentSlot);refreshUI();
    }finally{
        isProcessing=false;gameState.isProcessing=false;
    }
}
// ========== 全局辅助函数 ==========
function chPrestige(d){ gameState.prestige = clamp(Number(gameState.prestige) + d, 0, 100); }
function chMorale(d){ gameState.armyMorale = clamp(Number(gameState.armyMorale) + d, 0, 100); }
function chFaction(f, d){ gameState.factions[f] = clamp(Number(gameState.factions[f]) + d, 0, 100); }
function chSupport(d){ gameState.peopleSupport = clamp(Number(gameState.peopleSupport) + d, 0, 100); }

function handleFactionEvent(title, idx){
    var ev = gameState.factionEvents.find(function(e){ return e.event.title === title && !e.handled; });
    if(!ev) return;
    var opt = ev.event.options[idx];
    if(opt){
        opt.effect();
        ev.handled = true;
        saveToSlot(currentSlot);
        refreshUI();
    }
}

function handleProvinceEvent(peid, oi){
    var ev = gameState.provinceEvents.find(function(e){ return e.id === peid; });
    if(!ev || ev.handled) return;
    var opt = ev.options[oi];
    if(opt){
        opt.effect();
        ev.handled = true;
        addLog('🏙️ 州府事件处理','important');
        saveToSlot(currentSlot);
        refreshUI();
    }
}

function confirmAdvanceMonth(){
    if(gameState.inCourt){
        showToast('朝会中，先退朝','danger');
        return;
    }
    showModal('📅 进入下一个月','确认推进吗？',[
        {label:'确认',onclick:'Game._doAdvanceMonth()'},
        {label:'取消',onclick:'Game.closeModal()'}
    ]);
}

function _doAdvanceMonth(){
    closeModal();
    advanceMonth();
}

// ========== 小目标系统 ==========
function getNextSmallGoal(s){
    var goals = [
        {id:'treasury_10m', text:'国库达到1000万两', check:function(){return s.treasury>=10000000;}, reward:'声望+1'},
        {id:'support_80', text:'民心提升至80', check:function(){return s.peopleSupport>=80;}, reward:'行政效率+1'},
        {id:'province_8', text:'拥有8座州府', check:function(){return s.provinces.length>=8;}, reward:'国库+50万'},
        {id:'harem_10', text:'后宫佳丽达到10人', check:function(){return s.harem.members.length>=10;}, reward:'全体佳丽宠爱+2'},
        {id:'general_3', text:'拥有3名将领', check:function(){return s.generals.length>=3;}, reward:'士气+3'},
        {id:'building_5', text:'建成5座建筑', check:function(){var cnt=0;Object.keys(s.infrastructure).forEach(function(k){cnt+=Number(s.infrastructure[k])||0;});return cnt>=5;}, reward:'行政效率+1'},
        {id:'cultivation_2', text:'修仙达到筑基', check:function(){return s.cultivation.realmIndex>=2;}, reward:'修为+50'}
    ];
    for(var i=0;i<goals.length;i++){
        if(!goals[i].check()){
            return goals[i];
        }
    }
    return null;
}

function completeSmallGoal(s, goal){
    if(goal.reward === '声望+1') s.prestige=clamp(Number(s.prestige)+1,0,100);
    else if(goal.reward === '行政效率+1') s.administrationEfficiency=clamp(Number(s.administrationEfficiency)+1,0,100);
    else if(goal.reward === '国库+50万') s.treasury+=500000;
    else if(goal.reward === '全体佳丽宠爱+2') s.harem.members.forEach(function(m){m.favor=clamp(Number(m.favor)+2,0,100);});
    else if(goal.reward === '士气+3') s.armyMorale=clamp(Number(s.armyMorale)+3,0,100);
    else if(goal.reward === '修为+50') s.cultivation.cultivationExp=(Number(s.cultivation.cultivationExp)||0)+50;
    addLog('🎯 完成小目标：'+goal.text+'，奖励：'+goal.reward, 'success');
    showToast('🎯 完成小目标：'+goal.text, 'success');
}

        // ========== 成就页面 ==========
        function rAchievements(s){
            var html='';
            s.achievements.forEach(function(a){
                html+='<div style="font-size:.65em;padding:2px;">🏆'+a.name+(a.desc?' - '+a.desc:'')+'</div>';
            });
            if(s.achievementBonus && Object.keys(s.achievementBonus).length>0){
                html+='<p style="font-size:.65em;margin-top:4px;">成就加成：</p>';
                if(s.achievementBonus.taxRate)html+='<div style="font-size:.62em;">税收+'+(s.achievementBonus.taxRate*100)+'%</div>';
            }
            if(s.emperorHealthMax>100)html+='<div style="font-size:.62em;">健康上限+'+((s.emperorHealthMax||100)-100)+'</div>';
            return{title:'成就（'+s.achievements.length+'个）',content:html||'<p>尚未解锁成就。</p>',actions:''};
        }

        // ========== 切换页签 ==========
        function switchTab(tab){
            if(tab==='cultivation'&&!gameState.cultivation.unlocked){showToast('修仙未解锁','danger');return;}
            currentTab=tab;
            refreshUI();
        }

            var key='update_notice_v9_balance_fix';

                '<p><strong>🔧 本次更新：</strong></p>'+

        // ========== 初始化 ==========
        function init(){
            try{
                showStartScreen();
                updateSaveSlots();
                showUpdateNotice();
            }catch(e){
                console.error('初始化失败',e);
                alert('游戏初始化出错，请刷新页面重试。错误：'+e.message);
            }
        }

        // ========== 返回对象 ==========
        return{
            init:init,
            selectNovice:selectNovice,
            onDifficultyChange:onDifficultyChange,
            startNewGame:startNewGame,
            continueGame:continueGame,
            switchTab:switchTab,
            performAction:performAction,

            _doAdvanceMonth:_doAdvanceMonth,
            confirmReset:confirmReset,
            _doReset:_doReset,
            closeModal:closeModal,

    document.addEventListener('DOMContentLoaded',function(){
        try{
            Game.init();
            window.Game=Game;

            console.error('加载失败',e);
